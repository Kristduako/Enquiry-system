<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>New Enquiry🖥</title>
	<link rel="stylesheet" type="text/css" href="NE style.css">
</head>
<body class="body"><br>
	<div class="div">
		<h1 class="h1">ENQUIRY FORM 📚</h1><p class="p">Create a New Enquiry Form </p>
	
		<form>

			<label class="lb1">Name</label><br>
			<input type="text" name="fname" class="input"><br>

			<label class="lb1">Course📖</label><br>
			<input type="text" name="course" class="input"><br>

			<label class="lb1">Date 📅</label><br>
			<input type="Date" name="date" class="input"><br>

			<label class="lb1">Status🟢</label><br>
			<input list="Status" name="Status" placeholder="Status" class="input"><br>
			<datalist id="Status">
				<option value="Cancelled"></option>
				<option value="Registered"></option>
				<option value="Pending"></option>
			</datalist>

			<label class="lb1">Contact📞</label><br>
			<input type="number" name="Contact" class="input"><br><br>

			<input type="submit" name="submit" value="Create" class="input1"><a href="index.html" class="input1">Back</a><br><br>
			
			
		</form>
	</div>

</body>
</html>
